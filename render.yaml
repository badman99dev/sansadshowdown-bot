# Render Blueprint — deploys the bot as a web service in Singapore.
# In Render: New -> Blueprint -> connect this repo. It reads this file.
services:
  - type: web
    name: sansadshowdown-bot
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    # free auto-deploy on every push to main (not a paid feature)
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "20.20.2"
      - key: MAX_SESSIONS
        value: "6"
